<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05080f" />
  <title>JARVIS PRIME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="core"><span></span></div>
      <div class="brand">
        <h1>JARVIS <b>PRIME</b></h1>
        <p id="status">● En ligne</p>
      </div>
      <button id="langBtn" class="chip" aria-label="Langue">FR</button>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <form id="composer" class="composer">
      <button type="button" id="micBtn" class="icon" aria-label="Voix (bientôt)" title="Voix — étape suivante">🎙</button>
      <input id="input" autocomplete="off" placeholder="Parle à JARVIS…" />
      <button type="submit" class="send" aria-label="Envoyer">➤</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
